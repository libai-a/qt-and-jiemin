<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>未来科技感页面</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="fx" aria-hidden="true">
      <canvas class="fx__canvas" id="fxCanvas"></canvas>
      <div class="fx__vignette"></div>
      <div class="fx__glow fx__glow--a"></div>
      <div class="fx__glow fx__glow--b"></div>
      <div class="fx__scanlines"></div>

      <div class="pulse" id="pulse">
        <span class="pulse__ring pulse__ring--1"></span>
        <span class="pulse__ring pulse__ring--2"></span>
        <span class="pulse__ring pulse__ring--3"></span>
        <span class="pulse__core"></span>
      </div>
    </div>

    <main class="stage">
      <h1 class="title">FUTURE INTERFACE</h1>
      <p class="subtitle">点击按钮或按下空格键，触发能量脉冲动画</p>

      <button class="neo-btn" id="pulseBtn" type="button">
        <span class="neo-btn__text">
          点击启动
          <span class="kbd" aria-hidden="true">Space</span>
        </span>
        <span class="neo-btn__ring" aria-hidden="true"></span>
      </button>

      <div class="hint">也支持：按下空格键（无需先选中按钮）</div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
